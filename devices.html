<header class="header">

  <div class="toolbar">
    <input type="search" id="search" placeholder="🔍 ابحث بالاسم، IP، MAC..." aria-label="بحث">
    <select id="sort" class="chip"><option value="name">الاسم</option><option value="usage">الاستهلاك</option><option value="ip">IP</option></select>
  </div>
  <div class="toolbar">
    <button class="chip active" data-filter="all">الكل</button>
    <button class="chip" data-filter="wifi">Wi-Fi</button>
    <button class="chip" data-filter="ethernet">Ethernet</button>
    <button class="chip" data-filter="online">متصل</button>
    <button class="chip" data-filter="offline">غير متصل</button>
  </div>
  <div class="grid grid-2" id="devices-list">
    <div class="card skeleton" style="height:90px"></div><div class="card skeleton" style="height:90px"></div>
    <div class="card skeleton" style="height:90px"></div><div class="card skeleton" style="height:90px"></div>

<nav class="bottomnav">

<dialog id="rename-dialog-none"></dialog>
<dialog id="rename-dialog">
  <h3 style="font-weight:700">تعديل اسم الجهاز</h3>
  <input id="rename-input" maxlength="40" placeholder="مثال: هاتف عماد">
  <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
    <button class="btn" onclick="this.closest('dialog').close()">إلغاء</button>
    <button class="btn primary" id="rename-save">حفظ</button>
  </div>
</dialog>
<div class="toast-wrap"></div>
<script src="js/utils.js"></script><script src="js/storage.js"></script>
