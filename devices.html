        <main class="main-content">

                <div id="offline-badge" class="offline-badge hidden">

                </div>
                <button id="theme-toggle" class="icon-btn" aria-label="تبديل المظهر"><i class="fa-solid fa-moon"></i></button>
                <div class="user-profile">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </div>

                    </div>
                    <div class="filter-group">
                        <select id="filter-connection" class="filter-select">
                            <option value="all">كل الاتصالات</option>
                            <option value="wifi">Wi-Fi</option>
                            <option value="ethernet">Ethernet</option>
                        </select>
                        <select id="filter-status" class="filter-select">
                            <option value="all">كل الحالات</option>
                            <option value="online">متصل</option>
                            <option value="offline">غير متصل</option>

                    </div>
